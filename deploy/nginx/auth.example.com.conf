# Replace auth.example.com and the backend IP before use.
# Install as /etc/nginx/sites-available/auth.example.com and symlink into
# sites-enabled. Put proxy_params.conf in /etc/nginx/snippets/.

limit_req_zone $binary_remote_addr zone=portal_login:10m rate=10r/m;

server {
    listen 80;
    server_name auth.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.com;

    ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    # JWKS is public.
    location = /auth/v1/.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # Every other auth endpoint is backend-only. Replace with the sks
    # backend's egress IP.
    location /auth/v1/ {
        allow 203.0.113.10;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # Portal login gets an extra rate limit.
    location = /portal/login {
        limit_req zone=portal_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location = /portal {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location /portal/ {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location = /health {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location / {
        return 404;
    }
}
