{{define "title"}}{{.Org.Name}} · Users{{end}}

{{define "content"}}
<p><a href="/portal/apps/{{.Org.AppID}}/orgs">← Organizations</a></p>
<h1>{{.Org.Name}} — Users</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}

<table>
  <thead>
    <tr><th>Email</th><th>Role</th><th>Status</th></tr>
  </thead>
  <tbody>
    {{range .Users}}
      <tr>
        <td>{{.Email}}</td>
        <td>{{.Role}}</td>
        <td>{{.Status}}</td>
      </tr>
    {{else}}
      <tr><td colspan="3">No users yet.</td></tr>
    {{end}}
  </tbody>
</table>

<h2>Create SUPERADMIN</h2>
<form method="post" action="/portal/orgs/{{.Org.ID}}/users" class="inline">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Email
    <input type="email" name="email" required>
  </label>
  <label>Password
    <input type="password" name="password" minlength="8" required>
  </label>
  <button type="submit">Create user</button>
</form>
{{end}}
